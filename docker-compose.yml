---
services:
  opencloud:
    image: >-
      ${OPENCLOUD_IMAGE:?Set OPENCLOUD_IMAGE}:${OPENCLOUD_IMAGE_TAG:?Set
      OPENCLOUD_IMAGE_TAG}
    user: "${OPENCLOUD_LOCAL_UID:-1000}:${OPENCLOUD_LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      OC_URL: https://localhost:9200
      OC_SPACES_DEFAULT_QUOTA: "1000000000"
      OC_INSECURE: "true"
      OC_SHARING_PUBLIC_SHARE_MUST_HAVE_PASSWORD: "false"
      OC_SHARING_PUBLIC_WRITEABLE_SHARE_MUST_HAVE_PASSWORD: "true"
      OC_EXCLUDE_RUN_SERVICES: idp
      OC_OIDC_ISSUER: >-
        https://login.microsoftonline.com/${ENTRA_TENANT_ID:?Set
        ENTRA_TENANT_ID}/v2.0
      PROXY_OIDC_INSECURE: "false"
      PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: jwt
      PROXY_OIDC_SKIP_USER_INFO: "true"
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/entra-csp.yaml
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      PROXY_AUTOPROVISION_CLAIM_USERNAME: upn
      PROXY_USER_OIDC_CLAIM: upn
      PROXY_USER_CS3_CLAIM: username
      PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: groups
      GRAPH_USERNAME_MATCH: none
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
      WEB_OIDC_CLIENT_ID: ${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID}
      WEB_OIDC_SCOPE: >-
        openid profile email offline_access
        api://${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID}/access_as_user
      WEBFINGER_WEB_OIDC_CLIENT_ID: ${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID}
      WEBFINGER_WEB_OIDC_CLIENT_SCOPES: >-
        openid profile email offline_access
        api://${ENTRA_CLIENT_ID:?Set ENTRA_CLIENT_ID}/access_as_user
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      STORAGE_USERS_DRIVER: posix
      STORAGE_USERS_ID_CACHE_STORE: nats-js-kv
    volumes:
      - type: bind
        source: ./config/entra-csp.yaml
        target: /etc/opencloud/entra-csp.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/opencloud/config/proxy.yaml
        target: /etc/opencloud/proxy.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/opencloud/data
        target: /var/lib/opencloud
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/opencloud/config/opencloud.yaml
        target: /etc/opencloud/opencloud.yaml
        read_only: true
        bind:
          create_host_path: false
