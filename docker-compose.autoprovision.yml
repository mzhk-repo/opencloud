---
# Isolated local PoC; combine with docker-compose.yml and docker-compose.entra.yml.
services:
  opencloud:
    ports: !override
      - "127.0.0.1:19200:19200"
    environment:
      OC_URL: https://localhost:19200
      PROXY_HTTP_ADDR: 0.0.0.0:19200
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      PROXY_AUTOPROVISION_CLAIM_USERNAME: upn
      PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: roles
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
    volumes:
      - type: bind
        source: ./.local/autoprovision-poc/data
        target: /var/lib/opencloud
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/autoprovision-poc/config/opencloud.yaml
        target: /etc/opencloud/opencloud.yaml
        read_only: true
        bind:
          create_host_path: false
