---
# Group-claim experiment on the isolated autoprovisioning PoC only.
services:
  opencloud:
    environment:
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: groups
    volumes:
      - type: bind
        source: ./.local/autoprovision-poc/config/proxy.yaml
        target: /etc/opencloud/proxy.yaml
        read_only: true
        bind:
          create_host_path: false
