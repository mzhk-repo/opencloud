---
# Internal IdP for administration of the isolated PoC copy only.
services:
  opencloud:
    ports: !override
      - "127.0.0.1:19200:19200"
    environment:
      OC_URL: https://localhost:19200
      PROXY_HTTP_ADDR: 0.0.0.0:19200
    volumes:
      - type: bind
        source: ./.local/autoprovision-poc/data
        target: /var/lib/opencloud
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/autoprovision-poc/config/opencloud.yaml
        target: /etc/opencloud/opencloud.yaml
        read_only: true
        bind:
          create_host_path: false
